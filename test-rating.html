<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Rating Display</title>
    <link rel="stylesheet" href="http://localhost:8080/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="padding: 40px; background: #f0f0f0;">
    <h1>Current Rating Display</h1>
    <div style="display: flex; gap: 30px; flex-wrap: wrap;">
        <div class="card">
            <div class="image-content">
                <img src="https://via.placeholder.com/150x225/0000FF/FFFFFF?text=Movie+1" alt="Test Movie">
                <div class="percent-circle" style="border-color: #21d07a">
                    85<sup>%</sup>
                </div>
            </div>
            <div class="card-content">
                <h2>Test Movie 1</h2>
                <p>15 nov 2024</p>
            </div>
        </div>
        
        <div class="card">
            <div class="image-content">
                <img src="https://via.placeholder.com/150x225/FF0000/FFFFFF?text=Movie+2" alt="Test Movie">
                <div class="percent-circle" style="border-color: #d2d531">
                    55<sup>%</sup>
                </div>
            </div>
            <div class="card-content">
                <h2>Test Movie 2</h2>
                <p>20 nov 2024</p>
            </div>
        </div>
        
        <div class="card">
            <div class="image-content">
                <img src="https://via.placeholder.com/150x225/00FF00/FFFFFF?text=Movie+3" alt="Test Movie">
                <div class="percent-circle" style="border-color: #db2360">
                    30<sup>%</sup>
                </div>
            </div>
            <div class="card-content">
                <h2>Test Movie 3</h2>
                <p>25 nov 2024</p>
            </div>
        </div>
    </div>
</body>
</html>
